nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}nav button{border:0;background:none;color:var(--mu);padding:7px 11px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}

main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(290px,1fr);gap:16px;padding:16px 18px;max-width:1400px;margin:auto}

.cvw,aside{background:var(--pn);border:1px solid var(--ln);border-radius:14px;overflow:hidden}aside{padding:14px 16px}
canvas[hidden]{display:none}canvas{display:block;width:100%;aspect-ratio:900/520;touch-action:none}

.op.ok{background:#1c8a4c;color:#fff;border-color:#1c8a4c}.op.no{background:#c93a3a;color:#fff;border-color:#c93a3a}.ex{color:var(--mu);font-size:13.5px;margin:4px 0}

/* ===== ADD-ON: Home / Guide / Transitions (chỉ thêm mới) ===== */
@keyframes vsw{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes vfd{from{opacity:0}to{opacity:1}}
@keyframes vpp{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.vsw{animation:vsw .28s cubic-bezier(.2,.7,.2,1)}
#home{display:none;max-width:1400px;margin:auto;padding:16px 18px}

.hm{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:22px}
.hm h2{margin:0 0 6px;font-size:22px}.hm>p{margin:0 0 18px;color:var(--mu);max-width:680px}
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.hc{display:flex;flex-direction:column;gap:5px;text-align:left;padding:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer;transition:transform .18s,border-color .18s}

.hm .bt{margin-top:16px}

#vg{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,10,18,.6)}
#vg.open{display:flex;animation:vfd .22s ease}
.vgb{position:relative;width:100%;max-width:540px;max-height:88vh;overflow:auto;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:22px;animation:vpp .28s ease}

#vgx{position:absolute;top:10px;right:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 13px;font:inherit;font-weight:700;cursor:pointer}#vgx:hover{background:#c93a3a;border-color:#c93a3a;color:#fff}
@media(prefers-reduced-motion:reduce){.vsw,#vg.open,.vgb{animation:none}.hc{transition:none}.hc:hover{transform:none}}
